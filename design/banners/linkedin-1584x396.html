<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1584px; height:396px; overflow:hidden; font-family: var(--font-sans); }
  .banner { width:1584px; height:396px; background: var(--ink);
    display:flex; align-items:center; justify-content:space-between; padding:0 100px 0 110px; position:relative; overflow:hidden; }
  .banner::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--grad); }
  .left { display:flex; align-items:center; gap:36px; z-index:2; }
  .tagline { font-family: var(--font-display); color: var(--white); font-size:42px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; }
  .tagline span { background: linear-gradient(90deg,#93C5FD,#D8B4FE); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-family: var(--font-mono); color:#94A3B8; font-size:18px; margin-top:12px; }
  img.mark { width:140px; height:140px; }
</style>
</head>
<body>
<div class="banner">
  <div class="left">
    <img class="mark" src="../logo/practice-drill-mark.svg" alt="">
    <div class="tagline">Practice Drill<br><span>Quizzes, code, then a grade.</span>
      <div class="sub">Quizzes · Code challenges · Graded sessions</div>
    </div>
  </div>
</div>
</body>
</html>
