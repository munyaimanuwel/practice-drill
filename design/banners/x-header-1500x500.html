<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1500px; height:500px; overflow:hidden; font-family: var(--font-sans); }
  .banner { width:1500px; height:500px; background: var(--ink); display:flex; align-items:center; padding:0 100px; position:relative; }
  .banner::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--grad); }
  img { width:160px; height:160px; margin-right:40px; }
  h1 { font-family: var(--font-display); color: var(--white); font-size:56px; font-weight:700; letter-spacing:-0.03em; line-height:1.1; }
  p { font-family: var(--font-mono); color:#94A3B8; font-size:20px; margin-top:16px; }
</style>
</head>
<body>
<div class="banner">
  <img src="../logo/interview-drill-mark.svg" alt="">
  <div>
    <h1>Interview Drill</h1>
    <p>Scheduled practice. Browser quizzes. Local IDE. Grade requested.</p>
  </div>
</div>
</body>
</html>
