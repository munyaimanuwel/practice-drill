<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1920px; height:600px; overflow:hidden; font-family: var(--font-sans); }
  .hero { width:1920px; height:600px; background:
      radial-gradient(1200px 600px at 88% -10%, rgba(124,58,237,.14), transparent 60%),
      radial-gradient(900px 500px at 8% 120%, rgba(37,99,235,.16), transparent 60%),
      var(--paper);
    display:flex; align-items:center; justify-content:space-between; padding:0 140px; position:relative; }
  .hero::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--grad); }
  .copy h1 { font-family: var(--font-display); font-size:72px; font-weight:700; color: var(--ink); letter-spacing:-0.03em; line-height:1.05; max-width:920px; }
  .grad { background: var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .copy p { margin-top:22px; font-size:26px; color: var(--muted); max-width:760px; line-height:1.5; }
  .cta { display:inline-flex; align-items:center; margin-top:40px; background: var(--grad);
         color:#fff; font-size:22px; font-weight:600; padding:18px 36px; }
  img.main { width:280px; height:280px; }
</style>
</head>
<body>
<div class="hero">
  <div class="copy">
    <h1>Drill the interview.<br><span class="grad">Before it drills you.</span></h1>
    <p>Quizzes and code challenges, scheduled like real interviews. Answer in the browser or your IDE, submit, and get graded.</p>
    <div class="cta">Open a session</div>
  </div>
  <img class="main" src="../logo/interview-drill-mark.svg" alt="">
</div>
</body>
</html>
