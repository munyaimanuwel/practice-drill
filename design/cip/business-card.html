<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interview Drill — Business Card</title>
<style>
  :root { --blue:#2563EB; --purple:#9333EA; --slate-900:#0F172A; --slate-400:#94A3B8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#F1F5F9; padding:40px; display:flex; gap:40px; align-items:center; justify-content:center; min-height:100vh; }
  .card { width:1050px; height:600px; border-radius:24px; overflow:hidden; box-shadow:0 20px 50px rgba(15,23,42,.18); flex-shrink:0; }

  /* FRONT */
  .front { background:var(--slate-900); color:#F1F5F9; display:flex; flex-direction:column; justify-content:space-between; padding:64px; position:relative; }
  .front::after { content:""; position:absolute; right:-120px; top:-120px; width:420px; height:420px; border-radius:50%;
    border:2px solid rgba(255,255,255,.06); box-shadow: inset 0 0 0 60px rgba(255,255,255,.02); }
  .name { font-size:44px; font-weight:700; letter-spacing:-0.01em; }
  .role { font-size:22px; color:#94A3B8; margin-top:6px; }
  .contact { font-size:19px; line-height:1.9; color:#CBD5E1; position:relative; z-index:1; }
  .accent { background:linear-gradient(135deg,var(--blue),var(--purple)); height:10px; width:180px; border-radius:5px; margin-top:28px; }

  /* BACK */
  .back { background:linear-gradient(135deg,var(--blue),var(--purple)); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="card front">
    <div>
      <img src="../logo/interview-drill-lockup-dark.svg" alt="Interview Drill" style="height:72px;">
      <div class="accent" style="margin-top:48px;"></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <div class="name">Manuwel Munyai</div>
        <div class="role">Owner · Interview Drill</div>
      </div>
      <div class="contact">
        manuwel@interviewdrill.dev<br>
        github.com/manuwel
      </div>
    </div>
  </div>

  <div class="card back">
    <img src="../logo/interview-drill-mark.svg" alt="" style="width:220px;height:220px;border-radius:48px;box-shadow:0 16px 40px rgba(15,23,42,.35);">
  </div>
</body>
</html>
