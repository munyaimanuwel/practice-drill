<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice Drill — Business Card</title>
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--font-sans); background: var(--paper); padding:40px; display:flex; gap:40px; align-items:center; justify-content:center; min-height:100vh; }
  .card { width:1050px; height:600px; overflow:hidden; box-shadow:0 20px 50px rgba(12,27,51,.18); flex-shrink:0; }
  .front { background: var(--ink); color: var(--white); display:flex; flex-direction:column; justify-content:space-between; padding:64px; position:relative; }
  .front::before { content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background: var(--grad); }
  .name { font-family: var(--font-display); font-size:44px; font-weight:700; letter-spacing:-0.02em; }
  .role { font-size:20px; color:#94A3B8; margin-top:8px; }
  .contact { font-family: var(--font-mono); font-size:16px; line-height:1.9; color:#CBD5E1; }
  .back { background: var(--grad); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="card front">
    <img src="../logo/practice-drill-lockup-dark.svg" alt="Practice Drill" style="height:64px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <div class="name">Practice Drill</div>
        <div class="role">Quizzes and code drills</div>
      </div>
      <div class="contact">
        hello@practicedrill.dev<br>
        github.com/practice-drill
      </div>
    </div>
  </div>

  <div class="card back">
    <img src="../logo/practice-drill-mark.svg" alt="" style="width:200px;height:200px;">
  </div>
</body>
</html>
