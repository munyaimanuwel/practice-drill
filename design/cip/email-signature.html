<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interview Drill — Email signature</title>
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--font-sans); background: var(--paper); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; }
  .sig { width:560px; background: var(--surface); border:1px solid var(--line); padding:28px 32px; display:flex; gap:20px; align-items:center; }
  .rule { width:4px; align-self:stretch; background: var(--grad); }
  .name { font-family: var(--font-display); font-size:20px; font-weight:600; color: var(--ink); }
  .role { font-size:13px; color: var(--muted); margin-top:2px; }
  .meta { font-family: var(--font-mono); font-size:12px; color:#243044; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div class="sig">
  <img src="../logo/interview-drill-mark.svg" width="56" height="56" alt="">
  <div class="rule"></div>
  <div>
    <div class="name">Manuwel Munyai</div>
    <div class="role">Owner · Interview Drill</div>
    <div class="meta">manuwel@interviewdrill.dev<br>Quizzes · Code challenges · Graded sessions</div>
  </div>
</div>
</body>
</html>
