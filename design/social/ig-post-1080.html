<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1080px; height:1080px; overflow:hidden; font-family: var(--font-sans); }
  .post { width:1080px; height:1080px; background: var(--ink); display:flex; flex-direction:column; justify-content:space-between; padding:90px; position:relative; }
  .post::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background: var(--grad); }
  img.mark { width:160px; height:160px; }
  h1 { color: var(--white); font-family: var(--font-display); font-size:76px; font-weight:700; letter-spacing:-0.03em; line-height:1.06; }
  h1 span { background: linear-gradient(90deg,#93C5FD,#D8B4FE); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#94A3B8; font-size:28px; line-height:1.5; max-width:820px; }
  .chips { display:flex; gap:14px; flex-wrap:wrap; }
  .chip { color:#E2E8F0; font-family: var(--font-mono); font-size:18px; padding:10px 18px; border:1px solid rgba(255,255,255,.22); }
</style>
</head>
<body>
<div class="post">
  <img class="mark" src="../logo/interview-drill-mark.svg" alt="">
  <div>
    <h1>Drill the interview.<br><span>Before it drills you.</span></h1>
    <p style="margin-top:28px">Scheduled quiz and code-challenge sessions. Solve locally, submit a zip, request a grade.</p>
  </div>
  <div class="chips"><div class="chip">Quiz</div><div class="chip">Code</div><div class="chip">Graded</div></div>
</div>
</body>
</html>
