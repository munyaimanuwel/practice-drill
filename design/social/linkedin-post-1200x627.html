<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1200px; height:627px; overflow:hidden; font-family: var(--font-sans); }
  .post { width:1200px; height:627px; background: var(--surface);
    display:flex; align-items:center; justify-content:space-between; padding:0 90px 0 102px; position:relative; }
  .post::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--grad); }
  h1 { font-family: var(--font-display); font-size:52px; font-weight:700; color: var(--ink); letter-spacing:-0.03em; line-height:1.12; max-width:640px; }
  h1 span { background: var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { font-size:22px; color: var(--muted); margin-top:18px; line-height:1.55; max-width:600px; }
  img.mark { width:220px; height:220px; flex-shrink:0; }
</style>
</head>
<body>
<div class="post">
  <div>
    <h1>A personal<br><span>practice desk.</span></h1>
    <p>Practice Drill — scheduled drills, browser quizzes, IDE code challenges, and graded reviews.</p>
  </div>
  <img class="mark" src="../logo/practice-drill-mark.svg" alt="">
</div>
</body>
</html>
