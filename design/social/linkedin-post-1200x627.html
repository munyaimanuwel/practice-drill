<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root { --blue:#2563EB; --purple:#9333EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1200px; height:627px; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; }
  .post { width:1200px; height:627px; background:#fff;
    display:flex; align-items:center; justify-content:space-between; padding:0 90px; position:relative; overflow:hidden; }
  .post::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px;
    background:linear-gradient(180deg,var(--blue),var(--purple)); }
  .grid-lines { position:absolute; inset:0;
    background-image:radial-gradient(rgba(15,23,42,.06) 1.5px, transparent 1.5px); background-size:34px 34px; }
  h1 { font-size:58px; font-weight:800; color:#0F172A; letter-spacing:-0.02em; line-height:1.12; z-index:2; max-width:640px; }
  h1 span { background:linear-gradient(90deg,var(--blue),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { font-size:24px; color:#475569; margin-top:20px; line-height:1.55; z-index:2; max-width:600px; }
  img.mark { width:250px; height:250px; border-radius:56px; box-shadow:0 24px 60px rgba(147,51,234,.28); z-index:2; flex-shrink:0; }
</style>
</head>
<body>
<div class="post">
  <div class="grid-lines"></div>
  <div style="z-index:2;">
    <h1>Building my own<br><span>interview gym.</span></h1>
    <p>Interview Drill — a personal practice app: scheduled drills, browser quizzes, IDE code challenges, and graded reviews.</p>
  </div>
  <img class="mark" src="../logo/interview-drill-mark.svg" alt="">
</div>
</body>
</html>
