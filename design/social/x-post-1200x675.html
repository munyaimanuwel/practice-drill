<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../_brand.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { width:1200px; height:675px; overflow:hidden; font-family: var(--font-sans); }
  .post { width:1200px; height:675px; background: var(--paper);
    display:flex; align-items:center; gap:56px; padding:0 90px 0 102px; position:relative; }
  .post::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--grad); }
  img.mark { width:200px; height:200px; flex-shrink:0; }
  h1 { font-family: var(--font-display); font-size:56px; font-weight:700; color: var(--ink); letter-spacing:-0.03em; line-height:1.08; }
  h1 span { background: var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { font-size:24px; color: var(--muted); line-height:1.5; margin-top:18px; max-width:620px; }
</style>
</head>
<body>
<div class="post">
  <img class="mark" src="../logo/practice-drill-mark.svg" alt="">
  <div>
    <h1>Interview prep,<br><span>on a schedule.</span></h1>
    <p>Timed quizzes and code challenges I download, solve in my IDE, and submit for grading.</p>
  </div>
</div>
</body>
</html>
